# =====================================================================
# Profile: api
# Mục đích: Chỉ chạy HTTP server / REST API. Tắt scheduled jobs và seeders.
# Để chạy: java -Dspring.profiles.active=api -jar app.jar
# =====================================================================

# --- Tắt scheduled jobs (chạy trên worker) ---
app.scheduled-jobs.enabled=false

# --- Tắt seeders (chạy trên worker) ---
app.seeders.enabled=false
app.mongo-init.enabled=false

# --- Bật đầy đủ tính năng API ---
app.ai.enabled=true
app.external-services.enabled=true
