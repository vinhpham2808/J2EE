# =====================================================================
# Profile: worker
# Mục đích: Chỉ chạy background jobs (scheduled + async).
#           Không expose HTTP server ra ngoài.
# Để chạy: java -Dspring.profiles.active=worker -jar app.jar
# =====================================================================

# --- Tắt web server (worker không cần HTTP) ---
spring.main.web-application-type=none

# SERVER_PORT vẫn phải có giá trị vì application.properties base dùng ${SERVER_PORT}
# Worker không thực sự lắng nghe port này (do web-application-type=none)
# Dùng giá trị mặc định an toàn để tránh lỗi unresolved placeholder
server.port=${SERVER_PORT:8081}

# --- Bật scheduled jobs ---
app.scheduled-jobs.enabled=true

# --- Bật seeders (worker là nơi duy nhất chạy seed) ---
app.seeders.enabled=true
app.mongo-init.enabled=true

# --- Tắt các tính năng không cần thiết cho worker ---
app.ai.enabled=false
app.external-services.enabled=false

# --- Tối ưu connection pool cho worker (ít traffic hơn) ---
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
