spring.application.name=moneymanager
spring.main.lazy-initialization=true

app.seeders.enabled=true
app.mongo-init.enabled=true
app.scheduled-jobs.enabled=true
app.ai.enabled=true
app.external-services.enabled=true

spring.config.import=optional:file:.env[.properties],optional:file:Backend/moneymanager/.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=${SERVER_PORT}

server.servlet.context-path=/api/v1.0

# UTF-8 Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force-response=true

# Tối ưu hoá Hibernate JDBC / Database Fetching (giảm rớt gói mạng với TiDB)
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Tối ưu Connection Pool (HikariCP) giữ Connection DB luôn mở
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
# Không fail-fast khi TiDB Cloud không connect được lúc startup (-1 = chọ vô hạn, app vẫn start)
spring.datasource.hikari.initialization-fail-timeout=-1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.flyway.enabled=false

spring.mail.host=${BREVO_HOST:smtp-relay.brevo.com}
spring.mail.port=${BREVO_PORT:587}
spring.mail.username=${BREVO_USERNAME}
spring.mail.password=${BREVO_PASSWORD}
spring.mail.properties.mail.smtp.from=${BREVO_FROM_EMAIL}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.cookie.name=mm_token
jwt.cookie.max-age=36000
jwt.cookie.secure=true
jwt.cookie.same-site=None

money.manager.frontend.url=${MONEY_MANAGER_FRONTEND_URL}
app.activation.url=${MONEY_MANAGER_FRONTEND_URL}
app.reset-password.url=${MONEY_MANAGER_BACKEND_URL}

# PayOS
payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}
payos.return-url=${PAYOS_RETURN_URL}
payos.cancel-url=${PAYOS_CANCEL_URL}
payos.webhook-url=${PAYOS_WEBHOOK_URL}
payos.status-sync-delay-ms=${PAYOS_STATUS_SYNC_DELAY_MS}

# Gemini AI - Round Robin key rotation (comma-separated list)
gemini.api-keys=${GEMINI_API_KEYS}
gemini.model=${GEMINI_MODEL}
gemini.base-url=${GEMINI_BASE_URL}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS}

# GPT-OSS (OpenRouter) - Round Robin key rotation (comma-separated list)
gptoss.api-keys=${GPTOSS_API_KEYS}
gptoss.model=${GPTOSS_MODEL}
gptoss.base-url=${GPTOSS_BASE_URL}
gptoss.timeout-seconds=${GPTOSS_TIMEOUT_SECONDS}

# OCR provider dedicated for receipt import
ocr.api-keys=${OCR_API_KEYS:}
ocr.model=${OCR_MODEL:}
ocr.base-url=${OCR_BASE_URL:}
ocr.timeout-seconds=${OCR_TIMEOUT_SECONDS:45}



# Google OAuth2
google.client-id=${GOOGLE_CLIENT_ID}

# AWS S3
aws.access-key=${AWS_ACCESS_KEY}
aws.secret-key=${AWS_SECRET_KEY}
aws.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_BUCKET}

# AWS Lambda
aws.lambda.document-function=${AWS_LAMBDA_DOCUMENT_FUNCTION}

# MongoDB Configuration
# Spring Boot 4.x: connection URI ở spring.mongodb.uri (không phải spring.data.mongodb.uri)
spring.mongodb.uri=${MONGODB_URI}
# Tắt auto-index-creation để không block startup khi SRV DNS resolve chậm
spring.data.mongodb.auto-index-creation=false

# Redis Configuration
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=${REDIS_TIMEOUT}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT}
# Tắt Redis Repositories tự động (chỉ dùng StringRedisTemplate thủ công)
spring.data.redis.repositories.enabled=false

# Multipart Upload Limits (Tăng giới hạn dung lượng upload ảnh/PDF hóa đơn)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
