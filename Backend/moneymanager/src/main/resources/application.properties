    spring.application.name=moneymanager
    spring.main.lazy-initialization=true

    spring.config.import=optional:file:.env[.properties],optional:file:Backend/moneymanager/.env[.properties]

    spring.datasource.url=${SPRING_DATASOURCE_URL}
    spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
    spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
    spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

    server.port=${SERVER_PORT:8080}

    server.servlet.context-path=/api/v1.0

    # Tối ưu hoá Hibernate JDBC / Database Fetching (giảm rớt gói mạng với TiDB)
    spring.jpa.properties.hibernate.jdbc.fetch_size=100
    spring.jpa.properties.hibernate.jdbc.batch_size=30
    spring.jpa.properties.hibernate.order_inserts=true
    spring.jpa.properties.hibernate.order_updates=true
    
    # Tối ưu Connection Pool (HikariCP) giữ Connection DB luôn mở
    spring.datasource.hikari.minimum-idle=2
    spring.datasource.hikari.maximum-pool-size=10
    spring.datasource.hikari.idle-timeout=300000
    spring.datasource.hikari.max-lifetime=1200000
    spring.datasource.hikari.connection-timeout=20000

    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.show-sql=false
    spring.jpa.properties.hibernate.format_sql=true

    # AWS SES Configuration
    aws.ses.access-key=${AWS_SES_ACCESS_KEY}
    aws.ses.secret-key=${AWS_SES_SECRET_KEY}
    aws.ses.region=${AWS_SES_REGION}
    aws.ses.from-email=${SES_FROM_EMAIL}

    # JWT
    jwt.secret=${JWT_SECRET}

    money.manager.frontend.url=${MONEY_MANAGER_FRONTEND_URL}

    app.activation.url=${MONEY_MANAGER_FRONTEND_URL}
    # Th�m d�ng n�y cho reset password
    app.reset-password.url=${MONEY_MANAGER_BACKEND_URL}

    # PayOS
    payos.client-id=${PAYOS_CLIENT_ID}
    payos.api-key=${PAYOS_API_KEY}
    payos.checksum-key=${PAYOS_CHECKSUM_KEY}
    payos.return-url=${PAYOS_RETURN_URL}
    payos.cancel-url=${PAYOS_CANCEL_URL}
    payos.webhook-url=${PAYOS_WEBHOOK_URL}
    payos.status-sync-delay-ms=${PAYOS_STATUS_SYNC_DELAY_MS:30000}

    gemini.api-key=${GEMINI_API_KEY}
    gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
    gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:30}

    # Google OAuth2
    google.client-id=${GOOGLE_CLIENT_ID}

    # AWS S3
    aws.access-key=${AWS_ACCESS_KEY}
    aws.secret-key=${AWS_SECRET_KEY}
    aws.region=${AWS_REGION:ap-southeast-1}
    aws.s3.bucket=${AWS_S3_BUCKET}

    # AWS Lambda
    aws.lambda.document-function=${AWS_LAMBDA_DOCUMENT_FUNCTION:generate-and-store-document}
