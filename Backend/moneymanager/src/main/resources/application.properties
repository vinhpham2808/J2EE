spring.application.name=moneymanager
spring.main.lazy-initialization=true

spring.config.import=optional:file:.env[.properties],optional:file:Backend/moneymanager/.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=${SERVER_PORT:8080}

server.servlet.context-path=/api/v1.0

# UTF-8 Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force-response=true

# Tối ưu hoá Hibernate JDBC / Database Fetching (giảm rớt gói mạng với TiDB)
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Tối ưu Connection Pool (HikariCP) giữ Connection DB luôn mở
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Brevo SMTP Configuration
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587

spring.mail.username=${BREVO_USERNAME}
spring.mail.password=${BREVO_PASSWORD}
spring.mail.properties.mail.smtp.from=${BREVO_FROM_EMAIL}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
brevo.from-email=${BREVO_FROM_EMAIL}

# JWT
jwt.secret=${JWT_SECRET}

money.manager.frontend.url=${MONEY_MANAGER_FRONTEND_URL}

app.activation.url=${MONEY_MANAGER_FRONTEND_URL}
app.reset-password.url=${MONEY_MANAGER_BACKEND_URL}

# PayOS
payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}
payos.return-url=${PAYOS_RETURN_URL}
payos.cancel-url=${PAYOS_CANCEL_URL}
payos.webhook-url=${PAYOS_WEBHOOK_URL}
payos.status-sync-delay-ms=${PAYOS_STATUS_SYNC_DELAY_MS:30000}

# Google OAuth2
google.client-id=${GOOGLE_CLIENT_ID}
google.android-client-id=${GOOGLE_ANDROID_CLIENT_ID}

# Gemini AI - Round Robin key rotation (comma-separated list)
gemini.api-keys=${GEMINI_API_KEYS:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:45}

# GPT-OSS (OpenRouter) - Round Robin key rotation (comma-separated list)
gptoss.api-keys=${GPTOSS_API_KEYS:}
gptoss.model=${GPTOSS_MODEL:openai/gpt-oss-120b:free}
gptoss.base-url=${GPTOSS_BASE_URL:https://openrouter.ai/api/v1}
gptoss.timeout-seconds=${GPTOSS_TIMEOUT_SECONDS:60}
gptoss.app-referer=${GPTOSS_APP_REFERER:https://moneymanager.app}
gptoss.app-title=${GPTOSS_APP_TITLE:Money Manager}

# Google OAuth2
google.client-id=${GOOGLE_CLIENT_ID}

# AWS S3
aws.access-key=${AWS_ACCESS_KEY}
aws.secret-key=${AWS_SECRET_KEY}
aws.region=${AWS_REGION:ap-southeast-1}
aws.s3.bucket=${AWS_S3_BUCKET}

# AWS Lambda
aws.lambda.document-function=${AWS_LAMBDA_DOCUMENT_FUNCTION:generate-and-store-document}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000
spring.data.redis.connect-timeout=2000
