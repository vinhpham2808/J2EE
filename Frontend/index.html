<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP: report-only in dev; enforced via vercel.json headers in prod -->
    <meta
      http-equiv="Content-Security-Policy-Report-Only"
      content="
        default-src 'self';
        script-src 'self' https://accounts.google.com https://apis.google.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com data:;
        img-src 'self' data: blob: https:;
        connect-src 'self' http://localhost:* https://*.render.com https://accounts.google.com https://www.googleapis.com;
        frame-src 'self' https://accounts.google.com https://*.google.com;
        object-src 'none';
        base-uri 'self';
        form-action 'self' https://accounts.google.com;
        frame-ancestors 'none';
      "
    />
    <title>Money Manager</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  </head>
  <body>
    <div id="app-init-loader">
      <style>
        #app-init-loader {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background-color: #f8fafc;
          z-index: 99999;
          transition: opacity 0.2s ease-out;
        }
        #app-init-loader.dark {
          background-color: #0a0e1a;
        }
        .init-spinner {
          width: 48px;
          height: 48px;
          border-radius: 50%;
          border: 4px solid #e2e8f0;
          border-top-color: #7c3aed;
          animation: init-spin 0.8s linear infinite;
        }
        #app-init-loader.dark .init-spinner {
          border-color: rgba(255, 255, 255, 0.05);
          border-top-color: #f59e0b;
        }
        @keyframes init-spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
      <script>
        (function() {
          const theme = localStorage.getItem("theme");
          const loader = document.getElementById("app-init-loader");
          if (theme === "dark" || (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            loader.classList.add("dark");
          }
        })();
      </script>
      <div class="init-spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
